name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q -o '*.zip' -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: proj
      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WiFi Analyzer - version ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
